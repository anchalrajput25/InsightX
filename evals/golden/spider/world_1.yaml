name: spider_world_1
description: 'Spider dev set, database world_1: 13 questions with the official gold SQL (fixed sample, seed 42). Difficulty by Spider rules.'
cases:
- id: world_1_0712
  difficulty: extra
  question: Which language is the most popular in Aruba?
  expected_sql: SELECT T2.Language FROM country AS T1 JOIN countrylanguage AS T2 ON T1.Code  =  T2.CountryCode WHERE T1.Name  =  "Aruba" ORDER BY Percentage DESC LIMIT 1
  order_matters: true
  tags:
  - spider
  - world_1
  verified: true
- id: world_1_0720
  difficulty: hard
  question: What is the name of country that has the shortest life expectancy in Asia?
  expected_sql: SELECT Name FROM country WHERE Continent  =  "Asia" ORDER BY LifeExpectancy LIMIT 1
  order_matters: true
  tags:
  - spider
  - world_1
  verified: true
- id: world_1_0722
  difficulty: medium
  question: What is the total population and maximum GNP in Asia?
  expected_sql: SELECT sum(Population) ,  max(GNP) FROM country WHERE Continent  =  "Asia"
  order_matters: false
  tags:
  - spider
  - world_1
  verified: true
- id: world_1_0726
  difficulty: medium
  question: What is the total surface area of the continents Asia and Europe?
  expected_sql: SELECT sum(SurfaceArea) FROM country WHERE Continent  =  "Asia" OR Continent  =  "Europe"
  order_matters: false
  tags:
  - spider
  - world_1
  verified: true
- id: world_1_0734
  difficulty: easy
  question: How many type of governments are in Africa?
  expected_sql: SELECT count(DISTINCT GovernmentForm) FROM country WHERE Continent  =  "Africa"
  order_matters: false
  tags:
  - spider
  - world_1
  verified: true
- id: world_1_0738
  difficulty: medium
  question: How many official languages does Afghanistan have?
  expected_sql: SELECT COUNT(*) FROM country AS T1 JOIN countrylanguage AS T2 ON T1.Code  =  T2.CountryCode WHERE T1.Name  =  "Afghanistan" AND IsOfficial  =  "T"
  order_matters: false
  tags:
  - spider
  - world_1
  verified: true
- id: world_1_0742
  difficulty: extra
  question: Which continent has the most diverse languages?
  expected_sql: SELECT T1.Continent FROM country AS T1 JOIN countrylanguage AS T2 ON T1.Code  =  T2.CountryCode GROUP BY T1.Continent ORDER BY COUNT(*) DESC LIMIT 1
  order_matters: true
  tags:
  - spider
  - world_1
  verified: true
- id: world_1_0768
  difficulty: medium
  question: What is the official language spoken in the country whose head of state is Beatrix?
  expected_sql: SELECT T2.Language FROM country AS T1 JOIN countrylanguage AS T2 ON T1.Code  =  T2.CountryCode WHERE T1.HeadOfState  =  "Beatrix" AND T2.IsOfficial  =  "T"
  order_matters: false
  tags:
  - spider
  - world_1
  verified: true
- id: world_1_0775
  difficulty: extra
  question: Which African countries have a smaller population than that of any country in Asia?
  expected_sql: SELECT Name FROM country WHERE Continent  =  "Africa"  AND population  <  (SELECT min(population) FROM country WHERE Continent  =  "Asia")
  order_matters: false
  tags:
  - spider
  - world_1
  verified: true
- id: world_1_0784
  difficulty: extra
  question: Which cities are in European countries where English is not the official language?
  expected_sql: SELECT DISTINCT T2.Name FROM country AS T1 JOIN city AS T2 ON T2.CountryCode  =  T1.Code WHERE T1.Continent  =  'Europe' AND T1.Name NOT IN (SELECT T3.Name FROM country AS T3 JOIN countrylanguage AS T4 ON T3.Code  =  T4.CountryCode WHERE T4.IsOfficial  =  'T' AND T4.Language  =  'English')
  order_matters: false
  tags:
  - spider
  - world_1
  verified: true
- id: world_1_0794
  difficulty: extra
  question: Find the number of cities in each district whose population is greater than the average population of cities?
  expected_sql: SELECT count(*) ,  District FROM city WHERE Population  >  (SELECT avg(Population) FROM city) GROUP BY District
  order_matters: false
  tags:
  - spider
  - world_1
  verified: true
- id: world_1_0798
  difficulty: medium
  question: Find the average life expectancy and total population for each continent where the average life expectancy is shorter than 72?
  expected_sql: SELECT sum(Population) ,  avg(LifeExpectancy) ,  Continent FROM country GROUP BY Continent HAVING avg(LifeExpectancy)  <  72
  order_matters: false
  tags:
  - spider
  - world_1
  verified: true
- id: world_1_0814
  difficulty: hard
  question: Which language is spoken by the largest number of countries?
  expected_sql: SELECT LANGUAGE FROM countrylanguage GROUP BY LANGUAGE ORDER BY count(*) DESC LIMIT 1
  order_matters: true
  tags:
  - spider
  - world_1
  verified: true
