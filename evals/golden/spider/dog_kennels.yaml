  - spider
  - dog_kennels
  verified: true
- id: dog_kennels_0960
  difficulty: extra
  question: List the last name of the owner owning the youngest dog.
  expected_sql: SELECT T1.last_name FROM Owners AS T1 JOIN Dogs AS T2 ON T1.owner_id  =  T2.owner_id WHERE T2.age  =  ( SELECT max(age) FROM Dogs )
  order_matters: false
