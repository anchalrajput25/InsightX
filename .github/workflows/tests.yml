name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Disposable PostgreSQL for the database tests (backend/tests/conftest.py).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: insightx
          POSTGRES_PASSWORD: insightx
          POSTGRES_DB: insightx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insightx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      INSIGHTX_TEST_DATABASE_URL: postgresql+psycopg2://insightx:insightx@localhost:5432/insightx_test
      # No real AI keys: tests replace LLM calls with scripted fakes.
      INSIGHTX_ROUTE_CHECKS: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps sentence-transformers' install small.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q
