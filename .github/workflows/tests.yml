name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # No real AI keys: tests replace LLM calls with scripted fakes.
      INSIGHTX_ROUTE_CHECKS: "0"
      # Database tests (backend/tests/conftest.py) are skipped: they need
      # INSIGHTX_TEST_DATABASE_URL and do not pass on a fresh PostgreSQL yet.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps sentence-transformers' install small.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q
